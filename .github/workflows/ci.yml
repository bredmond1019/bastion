name: ci

# Thin caller — invokes base-template's reusable Rust gate workflow, which
# mirrors this repo's planning/harness.json checks in declared order (fmt,
# clippy, test, build). See base-template/docs/ci.md for the opt-in model
# and the local actionlint -> act -> push validation loop.
#
# Note: harness.json also gates a repo-local `contract-corpus-drift` check
# (scripts/check-contract-corpus-drift.sh) that is not part of the shared
# gate-rust.yml shape. It is intentionally not run in hosted CI by this
# caller — see base-template/docs/ci.md Deviations.
#
# bastion path-depends on four sibling repos directly (bella-engine via ../bella, plus ../mev,
# ../okf-core, and three engine-rs crates via ../engine-rs) — see Cargo.toml. engine-rs's own
# workspace additionally path-depends on ../claude-code-rs (one level above ITS checkout, i.e.
# a sibling of bastion's own checkout too), so that fifth repo is required transitively. This
# caller opts into the reusable workflow's sibling-repo checkout for all five.

on:
  push:
  pull_request:

jobs:
  gate:
    uses: bredmond1019/agentic-base-template/.github/workflows/gate-rust.yml@main
    with:
      sibling-repos: |
        bredmond1019/bella
        bredmond1019/mev
        bredmond1019/okf-core
        bredmond1019/engine-rs
        bredmond1019/claude-code-rs
