[package]
name = "bastion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
actix = "0.13"
actix-http = "3"
actix-web = "4.9"
actix-web-actors = "4.3"
anyhow = "1.0.102"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3"
crossterm = "0.29.0"
dotenvy = "0.15.7"
petgraph = "0.8.3"
ratatui = "0.30.1"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tiktoken-rs = "0.12.0"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
typeshare = "1"
clap_mangen = "0.2"
bella-engine = { path = "../bella/crates/bella-engine" }
mev = { path = "../mev" }
okf-core = { path = "../okf-core" }
# Unpinned cross-repo path dependency (same shape as bella-engine/D14 and mev) —
# expect and coordinate breaks from ../engine-rs rather than assuming a bastion
# regression. Do NOT add `default-features = false`.
engine-serve = { path = "../engine-rs/crates/engine-serve" }
# Same unpinned cross-repo path-dependency posture as engine-serve above —
# needed at normal build time (not just tests) for the BA.11.M run-read
# projection (`TaskContext`/`NodeRunStatus`) and its `{id}` UUID parsing.
engine-contract = { path = "../engine-rs/crates/engine-contract" }
uuid = { version = "1", features = ["v4", "serde"] }
# Same unpinned cross-repo path-dependency posture as engine-serve/engine-contract
# above — needed at normal build time (not just tests) for BA.18.B's operator
# transport seam, which consumes engine_core::operator::ValidatedOperatorPayload.
# (Moved from [dev-dependencies] where it lived for the BA.7.C abort-contract
# integration test.)
engine-core = { path = "../engine-rs/crates/engine-core" }
# Needed at normal build time (not just tests) for the object-safe
# `OperatorTransport` trait in src/serve/notify/mod.rs (BA.18.B task 1).
async-trait = "0.1"
# Same unpinned cross-repo path-dependency posture as engine-serve/engine-contract/
# engine-core above — BA.18.F Phase 0b extraction: bastion::sessions::{tmux, model}
# become pub use shims over these. Do NOT add `default-features = false` (same
# posture as bella-engine, CLAUDE.md standing rule 7); term-core's `tokio` feature
# is intentionally left disabled — bastion needs only the unconditional modules
# (tmux/model/claude_state/detect).
term-core = { path = "../engine-rs/crates/term-core" }
term-attach = { path = "../engine-rs/crates/term-attach" }

[lib]
name = "bastion"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
# BA.7.C task 4: tests/abort_contract.rs stands up a real in-process
# engine-serve App (WaitNode fixture, same shape as
# ../engine-rs/crates/engine-serve/tests/abort_integration.rs) to exercise
# bastion's `api::client::abort_run` against the actual engine. Same unpinned
# cross-repo path-dependency posture as engine-serve above.
