# NO `rustc-wrapper = "sccache"` HERE — DELIBERATE. Measured 2026-08-27, same result engine-rs
# found on 2026-07-29 and mev found the same day:
#
#   $ sccache --show-stats
#   Compile requests             0
#   Compile requests executed    0
#   Cache hits                   0
#   Cache misses                 0
#
# sccache refuses to cache incremental compilations, and cargo passes `-C incremental=...` for the
# dev/test profile — so every rustc call fell straight through to plain rustc plus a wrapper hop
# doing nothing. Incremental compilation wins for this repo's edit-recompile-edit loop; sccache is
# gone. If you want it back for cold CI builds (no incremental state to reuse), set it via the
# RUSTC_WRAPPER env var together with CARGO_INCREMENTAL=0 — not here.
#
# See `[profile.dev]` in Cargo.toml for the link-time fix that actually helped here.
